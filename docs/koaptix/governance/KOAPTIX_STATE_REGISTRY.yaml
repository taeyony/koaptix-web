global_m906_reopen_policy:
  sealed_capability_presumption: "A sealed capability is presumed correct; the burden of proof is on reopening it."
  does_not_reopen_for:
    - "a new chat"
    - "a new CTO who does not remember details"
    - "a request for extra reassurance"
    - "an inconvenient old proof artifact"
    - "normal future service-row count evolution"
    - "unrelated future product work"
  allowed_conditions:
    - condition_id: "M906-REOPEN-01"
      condition: "Contradictory current production evidence shows that the accepted durable seed identity is missing or corrupt."
    - condition_id: "M906-REOPEN-02"
      condition: "A duplicate immutable generation or event unexpectedly appears."
    - condition_id: "M906-REOPEN-03"
      condition: "The publication pointer contradicts accepted durable publication semantics in a way attributable to M906."
    - condition_id: "M906-REOPEN-04"
      condition: "M906 sealed source or definition is intentionally modified."
    - condition_id: "M906-REOPEN-05"
      condition: "Protected role topology attributable to M906 is no longer restorable or exact."
    - condition_id: "M906-REOPEN-06"
      condition: "An accepted M906 security or semantic invariant is directly contradicted by new evidence."
    - condition_id: "M906-REOPEN-07"
      condition: "The user explicitly authorizes a redesign that intentionally supersedes M906."
  required_reopen_record_fields:
    - exact_reopen_condition
    - new_contradictory_evidence
    - affected_capability
    - scope_of_reopening
  narrow_scope_rule: "A narrow future issue must not automatically reopen the entire M906 chain."

